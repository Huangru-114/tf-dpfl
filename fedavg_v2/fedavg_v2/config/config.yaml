seed: 42

data:
  dataset:        "cifar10"
  img_size:       32
  batch_size:     16
  shuffle_buffer: 10000
  num_classes:    10

federation:
  n_clients:       100
  client_fraction: 0.5
  n_rounds:        50
  partition:       "pathological"   # "iid" or "noniid"
  alpha:           0.3        # Dirichlet alpha, only used when partition=noniid

training:
  local_epochs:   1
  learning_rate:  0.02
  lr_decay:       0.992


wandb:
  enabled:  true
  entity:   "3445339138-kth-royal-institute-of-technology"   # 改成你的 wandb 用户名
  project:  "fedavg-cifar10"
  run_name: "fedavg-pathological-alpha0.3-epoch1-frac0.5"
