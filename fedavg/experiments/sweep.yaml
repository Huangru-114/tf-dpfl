# experiments/sweep.yaml  –  WandB sweep（任务3）
#
# 维度：framework × distribution_config × attack_method × defense × seed（grid）。
# 每个 run 名按规范生成：{framework}_{distribution}_{attack}_seed{seed}
#
# 运行：
#   cd fedavg
#   wandb sweep experiments/sweep.yaml
#   wandb agent <ENTITY>/<PROJECT>/<SWEEP_ID>
#
# 注：本轮仅实现 4 个 framework；hier_fedavg_fedbn / hier_fedavg_fedrep 暂缓（见计划）。

program: main.py
method: grid

metric:
  name: local/asr_diff_edge
  goal: maximize

parameters:
  framework:
    values:
      - "hier_fedavg"
      - "hier_fedavg_ft"
      - "hier_pfedme"
      - "hier_ditto"
      - "hier_fedavg_fedrep"
      # - "hier_fedavg_fedbn"   # TODO: 未实现
  distribution_config:
    values:
      - "D1_patho_2"
      - "D4_dir_05"
      - "D6_iid"
      - "H1_patho_in_dir_out"
      - "H2_dir_in_patho_out"
  attack_method:
    values:
      - "badnet"
      - "blended"
      - "dba"
      - "neurotoxin"
      - "cerp"
      - "badpfl"
      - "none"
  defense:
    values:
      - "none"
      - "trimmed_mean"
      - "median"
      - "multi_krum"
      - "flame"
      - "dnc"
  seed:
    values:
      - 42
      - 123
      - 2024

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
