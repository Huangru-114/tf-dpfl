seed: 42
data:
  dataset:        "cifar10"
  img_size:       32
  batch_size:     16
  shuffle_buffer: 10000
  num_classes:    10
  per_client_test_ratio: 0.25

federation:
  edge_assignment:  "semantic"  # 可选 "random", "clustered"
  client_fraction:  1.0
  warmup_rounds:    5
  n_clients:        100
  n_edges:          2
  edge_rounds:      5
  n_rounds:         40
  partition:        "superclass_pathological"  # 可选 "iid", "noniid", "pathological", "superclass_pathological", "hierarchical"
  classes_per_client: 2
  alpha:            0.5
  # ── 层级两段式划分（partition="hierarchical" 时生效，任务1）──────────────
  # inter_edge=跨边缘节点分布，intra_edge=边缘节点内部分布。可由 H1–H4 配置展开。
  # type ∈ {iid, dirichlet, pathological}；pathological 在 inter 层用 classes_per_edge。
  inter_edge:       {type: "dirichlet", alpha: 0.5}
  intra_edge:       {type: "pathological", classes_per_client: 2}
  min_samples:      10            # 每客户端最小样本阈值（两段切分后均衡用）

training:
  local_epochs:   1
  learning_rate:  0.02
  lr_decay:       0.992
  drift_correction: "hierpfedme"  # 可选 "fedavg"/"hierfedavg", "fedprox", "feddyn", "pfedme", "hierpfedme",
                                  #      "hier_perfedavg", "hier_ditto", "hier_ditto_rep", "hier_pfedme_rep"
  proximal_ref:     "edge"
  # fedprox 相关超参数
  mu:               1.0
  mu_edge:          0.1
  mu_global:        0.01
  # feddyn 相关超参数
  alpha_feddyn:     0.1
  alpha_feddyn_global: 0.02
  # pfedme 相关超参数
  lambda_pfedme:    35.0
  beta_pfedme:      1.0
  pfedme_warm_start: false
  # Hier-pFedAvg 相关超参数
  lambda1_hier:     35.0
  lambda2_hier:     35.0
  beta_hier:        1.0
  # Hier-pFedMe 相关超参数
  #inner_steps_hier, 5会使得PM直接崩溃,这和文献报告完全不同,怀疑是实现细节问题,先改成2试试
  inner_steps_hier: 1
  alpha_inner:      0.01
  beta_outer:   0.01    # 外循环边缘更新步长
  label_smoothing: 0.1  # 防 NaN
  # Hier-Rep / Hier-Ditto 相关超参数
  plocal_epochs:    5   # FedRep: head 训练 epoch 数（须 > local_epochs）
  lambda_ditto:     0.1 # Ditto 个性化近端系数（client backbone / 整模型）
  ditto_pers_epochs: 1  # Hier-Ditto: 个性化模型 v_k 训练 epoch 数

model:
  arch: "fedavg_cnn"

# 后门攻击（KDD 2023 复现）。enabled=false 时对训练/评估无任何影响。
backdoor:
  enabled:        false
  trigger:        "badnet"      # "badnet"（3×3 白方块）| "blended"（图案混合）
  target_label:   9             # CIFAR-10 目标类（FEMNIST 用 1）
  poison_ratio:   0.5           # 恶意客户端本地数据投毒比例
  malicious_ids:  [15]          # 恶意客户端编号（concentrated 或显式时用；spread 时被解析结果覆盖）
  malicious_placement: "spread" # "spread"=跨 edge 分散（每 edge≥1）| "concentrated"=用 malicious_ids
  n_malicious:    4             # spread 时的恶意客户端数量（<=0 时回退 malicious_ids 长度）
  attack_freq_Q:  10            # fix-frequency：每 Q 轮强制参与一次
  badnet_size:    3             # BadNet 方块边长
  badnet_value:   1.0           # 方块像素值（[0,1] 空间，标准化前）
  blended_alpha:  0.2           # Blended 混合比例 α
  blended_image:  "attack/triggers/hello_kitty.png"  # 用户提供的图案文件
  eval_interval:  5             # 每多少轮算一次分层 ASR（建议 5，重型评估开销大）
  asr_max_samples: 0            # ASR 测试子采样上限（0=用全部非目标类样本）
  verbose_clients: true         # 是否逐 client 打印 C-Acc/ASR
  # ── 分层后门评估扩展（任务2）────────────────────────────────────────────
  feature_eval:          true   # 是否算特征空间分离度（global + 抽样 local）
  feature_eval_samples:  200    # 后门样本抽样数（特征分离度用，控制显存）
  feature_clean_per_class: 50   # 每类干净样本抽样数（特征质心用）
  forgetting_epochs:     5      # 遗忘曲线记录的本地 epoch 数（仅个性化/微调方法、仅评估轮）

wandb:
  enabled:  true
  entity:   "3445339138-kth-royal-institute-of-technology"
  project:  "HierFL-cifar10"
  # run_name: "H4_hierpfedme_c10_localepoch_5_random_dirichet_alpha_0.1"
  run_name: "final0_hierpfedme_c100_localepoch_1_semantic_superclass_pathological_classesperclient_2_k1"

evaluation:
  eval_interval: 1
  # 最后微调选项（PM 评估前对下发 edge 模型做少步本地微调；主要用于 Hier-FedAvg）
  final_finetune:       false  # 置 true 开启「FedAvg + 微调」式 PM 评估
  final_finetune_steps: 5      # 微调 epoch 数（默认回退 pm_steps）
  # final_finetune_lr:  0.02   # 微调学习率，默认回退 training.learning_rate
  # Held-out test-client 评估设定（衡量对新客户端的泛化）
  test_client_eval:    false  # 置 true 开启：留出一部分 client 不参与训练
  test_client_ratio:   0.2    # 留出比例
  test_finetune_steps: 5      # test client 接收 edge 模型后微调的 epoch 数
  # test_finetune_lr:  0.02   # 微调学习率，默认回退 training.learning_rate