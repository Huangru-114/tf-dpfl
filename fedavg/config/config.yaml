seed: 42
data:
  dataset:        "cifar10"
  img_size:       32
  batch_size:     16
  shuffle_buffer: 10000
  num_classes:    10
  per_client_test_ratio: 0.2

federation:
  edge_assignment:  "semantic"  # 可选 "random", "clustered"
  client_fraction:  1.0
  warmup_rounds:    5
  n_clients:        20
  n_edges:          2
  edge_rounds:      5
  n_rounds:         1
  partition:        "superclass_pathological"  # 可选 "iid", "pathological", "superclass_pathological"
  classes_per_client: 2
  alpha:            0.5

training:
  local_epochs:   1
  learning_rate:  0.02
  lr_decay:       0.992
  drift_correction: "hierpfedme"  # 可选 "none", "fedprox", "feddyn", "pfedme", "hierpfedme", "hier_perfedavg"
  proximal_ref:     "edge"
  # fedprox 相关超参数
  mu:               1.0
  mu_edge:          0.1
  mu_global:        0.01
  # feddyn 相关超参数
  alpha_feddyn:     0.1
  alpha_feddyn_global: 0.02
  # pfedme 相关超参数
  lambda_pfedme:    35.0
  beta_pfedme:      1.0
  pfedme_warm_start: false
  # Hier-pFedAvg 相关超参数
  lambda1_hier:     35.0
  lambda2_hier:     35.0
  beta_hier:        1.0
  # Hier-pFedMe 相关超参数
  inner_steps_hier: 3
  alpha_inner:      0.01
  beta_outer:   0.01    # 外循环边缘更新步长
  label_smoothing: 0.1  # 防 NaN

model:
  arch: "cifar_cnn_3conv"

wandb:
  enabled:  true
  entity:   "3445339138-kth-royal-institute-of-technology"
  project:  "HierFL-cifar10"
  # run_name: "H4_hierpfedme_c10_localepoch_5_random_dirichet_alpha_0.1"
  run_name: "final0_hierpfedme_c20_localepoch_1_semantic_superclass_pathological_classesperclient_2"

evaluation:
  eval_interval: 5