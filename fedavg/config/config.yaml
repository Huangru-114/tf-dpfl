seed: 42
data:
  dataset:        "cifar10"
  img_size:       32
  batch_size:     16
  shuffle_buffer: 10000
  num_classes:    10
  per_client_test_ratio: 0.25

federation:
  edge_assignment:  "semantic"  # 可选 "random", "clustered"
  client_fraction:  1.0
  warmup_rounds:    5
  n_clients:        100
  n_edges:          2
  edge_rounds:      5
  n_rounds:         40
  partition:        "superclass_pathological"  # 可选 "iid", "pathological", "superclass_pathological"
  classes_per_client: 2
  alpha:            0.5

training:
  local_epochs:   1
  learning_rate:  0.02
  lr_decay:       0.992
  drift_correction: "hierpfedme"  # 可选 "none", "fedprox", "feddyn", "pfedme", "hierpfedme", "hier_perfedavg",
                                  #      "hier_ditto", "hier_ditto_rep", "hier_pfedme_rep"
  proximal_ref:     "edge"
  # fedprox 相关超参数
  mu:               1.0
  mu_edge:          0.1
  mu_global:        0.01
  # feddyn 相关超参数
  alpha_feddyn:     0.1
  alpha_feddyn_global: 0.02
  # pfedme 相关超参数
  lambda_pfedme:    35.0
  beta_pfedme:      1.0
  pfedme_warm_start: false
  # Hier-pFedAvg 相关超参数
  lambda1_hier:     35.0
  lambda2_hier:     35.0
  beta_hier:        1.0
  # Hier-pFedMe 相关超参数
  #inner_steps_hier, 5会使得PM直接崩溃,这和文献报告完全不同,怀疑是实现细节问题,先改成2试试
  inner_steps_hier: 1
  alpha_inner:      0.01
  beta_outer:   0.01    # 外循环边缘更新步长
  label_smoothing: 0.1  # 防 NaN
  # Hier-Rep / Hier-Ditto 相关超参数
  plocal_epochs:    5   # FedRep: head 训练 epoch 数（须 > local_epochs）
  lambda_ditto:     0.1 # Ditto 个性化近端系数（client backbone / 整模型）
  ditto_pers_epochs: 1  # Hier-Ditto: 个性化模型 v_k 训练 epoch 数

model:
  arch: "fedavg_cnn"

wandb:
  enabled:  true
  entity:   "3445339138-kth-royal-institute-of-technology"
  project:  "HierFL-cifar10"
  # run_name: "H4_hierpfedme_c10_localepoch_5_random_dirichet_alpha_0.1"
  run_name: "final0_hierpfedme_c100_localepoch_1_semantic_superclass_pathological_classesperclient_2_k1"

evaluation:
  eval_interval: 1
  # Held-out test-client 评估设定（衡量对新客户端的泛化）
  test_client_eval:    false  # 置 true 开启：留出一部分 client 不参与训练
  test_client_ratio:   0.2    # 留出比例
  test_finetune_steps: 5      # test client 接收 edge 模型后微调的 epoch 数
  # test_finetune_lr:  0.02   # 微调学习率，默认回退 training.learning_rate