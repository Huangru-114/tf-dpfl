seed: 42
data:
  dataset:        "cifar10"
  img_size:       32
  batch_size:     16
  shuffle_buffer: 10000
  num_classes:    100  

#现在都使用数据增强
# data:
#   dataset:        "gtsrb"
#   img_size:       32
#   batch_size:     64
#   shuffle_buffer: 10000
#   num_classes:    43
#   data_dir:        "/mimer/NOBACKUP/groups/naiss2025-22-1095/Gao/GTSRB"

federation:
  edge_assignment: "random"   # random / gradient / histogram / semantic ← 分配策略
  client_fraction:  1.0
  warmup_rounds:    5
  n_clients:       100
  n_edges:         2          # 新增：Edge Server 数量
  edge_rounds:     7          # 新增：每次全局通信里 Edge 内部聚合轮数
  n_rounds:        200
  partition:       "pathological"  # iid / noniid / pathological
  alpha:           0.5


training:
  local_epochs:   1
  learning_rate:  0.02
  lr_decay:       0.992   # 文献值，每 epoch 衰减一次


  drift_correction: "pfedme"   # fedavg/fedprox/feddyn/scaffold/pfedme/perfedavg/hierpfedme
  proximal_ref:     "edge"      # global / edge / both

  # FedProx / FedDyn 参数
  mu:           1.0
  mu_edge:      0.1             # both 模式下的 edge 近端项系数
  mu_global:    0.01            # both 模式下的 global 近端项系数
  alpha_feddyn: 0.1          # FedDyn 中 local 模型的动量系数
  alpha_feddyn_global: 0.02           # FedDyn 中 global 模型的动量系数

 # pFedMe
  lambda_pfedme: 35.0
  beta_pfedme: 1.0
  pfedme_warm_start: false
#HierPFedMe
  lambda1_hier:     35.0   # λ1，edge-cloud 正则强度
  lambda2_hier:     35.0   # λ2，client-edge 正则强度
  beta_hier:        1.0    # β=1 退化为标准 FedAvg，论文默认
  inner_steps_hier: 1      # 内层每步的梯度步数

  # Per-FedAvg
  alpha_inner: 0.01             # 内层适配步长

model:
  arch: "cifar_cnn_3conv" 
#现在实际为16-4，训练时间减半，仅降低1.6%准确率，FL通信成本大幅降低

wandb:
  enabled:   true            # set true when running real experiments
  entity:    "3445339138-kth-royal-institute-of-technology"        # 你的 wandb 账号名
  project:   "HierFL-cifar10"  # 你创建的 wandb 项目名
  # run_name:  "HierWRN164prox_mu=1.0_client=50_edge=5_rounds=10_edge rounds=5_localepoch=6_0.5_frac=0.7_hs"  # 可选，设置后在 wandb 上更容易识别不同实验
  run_name:  "hierpfedme-random-paper"  # 可选，设置后在 wandb 上更容易识别不同实验

evaluation:
  eval_interval: 10    # 每 10 轮评估一次 EM/PM，最后一轮强制评估