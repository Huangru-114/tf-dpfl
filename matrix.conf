# matrix.conf  —  三维实验矩阵的定义（attack × method × defense × seed）
#
# 被 submit_matrix.sh 读取。改这个文件就等于改矩阵，不用动提交脚本。
# 用空格分隔；注释行以 # 开头。

# ── 攻击轴（--attack_method 的取值）────────────────────────────────────────
# none/badnet/blended/dba 是静态投毒；neurotoxin/cerp/badpfl 是连续/动态攻击。
ATTACKS="none badnet dba neurotoxin"

# ── PFL 方法轴（training.drift_correction）────────────────────────────────
# 合法取值见 fedavg/config_validate.py: METHOD_SUPPORTS_DEFENSE
METHODS="hierfedavg hierpfedme hier_ditto hier_fedrep"

# ── 防御轴（--defense）───────────────────────────────────────────────────
DEFENSES="none trimmed_mean multi_krum flame"

# ── 种子 ────────────────────────────────────────────────────────────────
SEEDS="42 43 44"

# ── 基础配置文件（相对仓库根目录）─────────────────────────────────────────
# 正式矩阵用 fedavg/config/config.yaml；先跑通流程建议用 experiments/smoke-base.yaml
BASE_CONFIG="fedavg/config/config.yaml"

# ── 每格额外的 override（可留空）。多个用分号分隔，语法同 main.py --override
EXTRA_OVERRIDES="wandb.enabled=false"

# ── 是否拦掉「攻击轴 × 方法轴不正交」的格子（CLAUDE.md 陷阱 #1）────────────
# true  = 这些格子直接不提交（推荐：省机时，且它们的 ASR 本来就不可解释）
# false = 照常提交，只在日志里告警
SKIP_NON_ORTHOGONAL=true
