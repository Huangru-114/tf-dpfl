# Experiment 3（改版）运行组登记表 —— 口径版本 P2
#
# 这是 PLAN.md §4 的机器可读版本。`python3 harness/status.py <本文件>` 逐格对账；
# `python3 harness/registry.py <本文件>` 列出每组 run 数与还缺什么。
#
# 现在每个组都是 blocked，这是**预期状态**：
#   · base（A4 定）= base.yaml（P1 锚点格 2edge_distributed，去掉死配置）+ overlays 里的
#     「P2 对齐」模板 fedavg/config/alignment_p2.yaml。P2 = 模板全开（config_validate 核对）
#   · requires: [audit] → AUDIT.md 还有未关闭的行（A08 / A26 等 pilot，A15 / A25 等集群复核）
#   · 各组的 `set:` 大多还是空的：因素的 label 已定，对应哪个配置键要等功能会话
#     （S3 划分 / S4 下限与时间窗 / S5 逐 edge 轮评估 / S6 更新日志）实现后再填
# 功能会话完成时，把它的 token 加进 `available`，并补上对应组的 `set:`。

study: hfl-mechanism
protocol: P2
layout: nested
results_dir: results
configs_dir: configs
base: base.yaml       # A4（2026-09-26）
overlays:
  - ../../../fedavg/config/alignment_p2.yaml   # 「P2 对齐」模板：每个对齐开关都打开
audit: AUDIT.md
available: []         # 已完成的功能会话，如 [S3, S4]

groups:
  G0:
    purpose: "3.1 对抗下限主干：ρ=0 影子攻击者 × 划分（兼作 3-B 逐 edge 下限、3.3 对照）"
    requires: [audit, S3, S4]
    seeds: [42, 43, 44]
    factors:
      partition:
        - {label: random}
        - {label: C1}
        - {label: C2}
        - {label: C3}
        - {label: C4}

  G1:
    purpose: "3-C 锯齿、3-D 可观测性（详细记录：逐 edge 轮评估 + 更新日志）；3-A 的一部分"
    requires: [audit, S3, S5, S6]
    seeds: [42, 43, 44]
    set: {federation.n_edges: 4}
    factors:
      partition:
        - {label: random}
        - {label: C1}
      placement:
        - {label: collocated}
        - {label: distributed}
      r_edge:
        - {label: R10, set: {federation.edge_rounds: 10}}
        - {label: R20, set: {federation.edge_rounds: 20}}

  G2:
    purpose: "3-A 结构扫描：flat vs HFL 的 T50 比值（主结论，5 seed）；去掉 G1 已覆盖的 4edge×R{10,20}"
    requires: [audit, S5]
    seeds: [42, 43, 44, 45, 46]
    cells:
      - {cell: flat,     set: {federation.n_edges: 1,  federation.edge_rounds: 1}}
      - {cell: e2-R2,    set: {federation.n_edges: 2,  federation.edge_rounds: 2}}
      - {cell: e2-R5,    set: {federation.n_edges: 2,  federation.edge_rounds: 5}}
      - {cell: e2-R10,   set: {federation.n_edges: 2,  federation.edge_rounds: 10}}
      - {cell: e2-R20,   set: {federation.n_edges: 2,  federation.edge_rounds: 20}}
      - {cell: e4-R2,    set: {federation.n_edges: 4,  federation.edge_rounds: 2}}
      - {cell: e4-R5,    set: {federation.n_edges: 4,  federation.edge_rounds: 5}}
      - {cell: e10-R2,   set: {federation.n_edges: 10, federation.edge_rounds: 2}}
      - {cell: e10-R5,   set: {federation.n_edges: 10, federation.edge_rounds: 5}}
      - {cell: e10-R10,  set: {federation.n_edges: 10, federation.edge_rounds: 10}}
      - {cell: e10-R20,  set: {federation.n_edges: 10, federation.edge_rounds: 20}}

  G3:
    purpose: "3-B 目标类分布：固定设计 C2/C3/C4（collocated）+ 层级 Dirichlet α_e 扫描"
    requires: [audit, S3]
    seeds: [42, 43, 44]
    cells:
      - {cell: C2}
      - {cell: C3}
      - {cell: C4}
      - {cell: hdir-a0.1}
      - {cell: hdir-a0.3}
      - {cell: hdir-a1}
      - {cell: hdir-a10}

  G4:
    purpose: "3.2 私有头吸收：投毒率 ρ × {FedRep, FedAvg}"
    requires: [audit, S6]
    seeds: [42, 43, 44]
    factors:
      rho:
        - {label: p0.25, set: {backdoor.poison_ratio: 0.25}}
        - {label: p1.0,  set: {backdoor.poison_ratio: 1.0}}
      method:
        - {label: fedrep, set: {training.drift_correction: hier_fedrep}}
        - {label: fedavg, set: {training.drift_correction: hierfedavg}}

  G5:
    purpose: "3.3 收敛门控：投毒窗口 [t0, t0+20) + 观察 50 轮，从头跑（不分叉）"
    requires: [audit, S4]
    seeds: [42, 43, 44]
    factors:
      t0:
        - {label: t20}
        - {label: t60}
        - {label: t100}
        - {label: t140}
        - {label: t180}

  G6:
    purpose: "3-E（可选）三层个性化：(a) FedRep 基线 / (b) 末 1 块 edge 内共享 / (c) 末 2 块"
    requires: [audit, S8]
    seeds: [42, 43, 44]
    factors:
      split:
        - {label: a}
        - {label: b}
        - {label: c}

  G7:
    purpose: "预处理对比（D-025）：主协议（标准化 + 增强）vs 官方预处理（不标准化、不增强），同 seed 配对。检验「官方设定降低了攻击难度」"
    requires: [audit]
    seeds: [42, 43, 44]
    factors:
      preproc:
        - {label: std}
        - {label: official, set: {data.normalize: false, data.augment: false}}
