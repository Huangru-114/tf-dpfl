# 阶段三（edge 原生防御）运行组登记表 —— 口径版本 P2（D0，2026-10-09）
#
# 这是 PLAN.md §4 的机器可读版本。工具与 hfl-mechanism 共用：
#   python3 harness/registry.py experiments/defense/edge-native/registry.yaml               # 每组 run 数 / 还缺什么
#   python3 harness/registry.py experiments/defense/edge-native/registry.yaml --materialize # **不带 --group**（CLAUDE.md 的警告：带了会把 INDEX.tsv 重写成只含那一组）
#   python3 harness/status.py   experiments/defense/edge-native/registry.yaml               # 逐格对账
#   bash experiments/defense/edge-native/submit.sh --status | --dry-run | （PACK=3）提交
#
# base = hfl-mechanism 的 base.yaml + P2 对齐模板（与 hfl-mechanism 逐字同一条链）→ 本表的配置与 G1R5 / G0 只差 `set:` 里写的键
#   （守卫 tests/test_edge_native_registry.py::test_snap_col_differs_from_g1r5_only_in_recording_switches）。
# 审计门槛沿用 hfl-mechanism/AUDIT.md（2026-09-27 全部关闭，D-006 对 P2 的 run 仍然成立）。
#
# 状态（2026-10-09，D0）：
#   · SNAP 已登记、可交（不改代码）：PLAN §4。快照 = 各 edge 的**上传前**模型（BackdoorCloudServer._snapshot 在
#     super().run_round() 之后、下一轮 broadcast_to_edges 之前 → edge 模型 = 本轮最后一次 edge 聚合 = 上传物）+ 全局 G + 每端私有部分 + 评估攻击者的生成器。
#   · CAL / CCSF 占位：requires 里的 SA1 / SA-C 是故意的（代码会话没做）。CCSF 的划分已定（D-098）。
#   · SNAP5（D-099：H1 / H3 是头条结论、跑到 5 seed → 对照臂补 s45 / s46）挂 `h-main`：P1 / CCSP 有臂判 go_main（H1 / H3 真要跑）时放行。
#   · P0 是离线组（零训练 run）→ 不进 groups，写在下面的 `offline:`（registry.py / status.py 不读它）。
#   · P1 / CCSP / H1 / H3 / … 等前置组给出标签后再登记（PLAN §5 的闸门）。
# **补 `set:` 时核对三件**（CLAUDE.md；test_edge_native_registry 守着）：
#   malicious_per_edge 的长度 = n_edges；n_rounds × edge_rounds = 300 有效轮（stopping 关，PLAN §0）；各格评估网格（有效轮）一致。

study: edge-native
protocol: P2
layout: nested
results_dir: results
configs_dir: configs
base: ../../attack/hfl-mechanism/base.yaml
overlays:
  - ../../../fedavg/config/alignment_p2.yaml        # 「P2 对齐」模板（同 hfl-mechanism）
audit: ../../attack/hfl-mechanism/AUDIT.md
available: [d0-prereg, sa1-pre, SA-C, ccs-space, ccsb-attack-ok]   # ccsb-attack-ok：CCSBOFF 良性端 0.796 ≥ 0.5，用户放行（2026-10-31，D-119）； sa1-pre：D-108（2026-10-28）； d0-prereg：N-008 用户确认（2026-10-10，D-101）。阶段三的代码会话（SA0 / SA1 / SA-C / …）完成时把 token 加进来

# ── D-base（PLAN §3.1）= G1R5 的 set 去掉 update_geometry / update_ck*，加 post_agg_eval + frozen_trigger ──
# YAML 锚点只为少抄一遍；展开后每组的 set 是完整的（registry.py 读的是展开结果）。
x-d-base: &d_base
  federation.n_edges: 4
  federation.partition: designed
  federation.design.condition: C1
  federation.design.strength: 0.25
  federation.design.n_per_client: 500
  federation.design.clean_per_edge: 500
  federation.design.alpha_client: 0.5
  federation.edge_rounds: 5
  federation.n_rounds: 60                    # 60 云轮 × R5 = 300 有效轮
  stopping: null
  evaluation.eval_grid: 5                    # R5 下网格 = 云轮（两个 eval_interval 取 base 的 1 = lcm(5,5)/5）
  evaluation.post_agg_eval: true             # Δ_jump / r_down（N-007 的量）
  evaluation.frozen_trigger: true            # 拆开「body 变了」与「触发器漂移」（PLAN §3.4）

offline:
  P0:
    purpose: "零训练离线反事实（PLAN §4 P0）：所有 edge 都加固后再聚合，受害 edge 的灌入砍掉多少"
    requires: [SA0, d0-prereg]     # SA0 = edge 侧 AT 核心 + 快照离线探针；d0-prereg = N-008 用户确认（已放行，D-101）
    inputs: "SNAP__{collocated,distributed}__s{42,43,44} 的 snapshot_r006 / snapshot_r015（tfdpfl-dumps/<run_id>.<job>/）"
    selection_seed: 42             # 配置只在 s42 上选，冻结后再读 s43 / s44（N-008）
    output: analysis/p0_verdict.json

groups:
  SNAP:
    purpose: "P0 的原料（S3 划分上的上传前 body + edge 干净集 + 各端私有 BN 统计量）+ 全部主检验的无防御对照臂（PLAN §4 SNAP）"
    requires: [audit]
    seeds: [42, 43, 44]
    # 有效性（PLAN §4）：collocated 的 s42–44 [Checksum] 逐轮 = G1R5 同 seed（instrumentation_check；记录 / 快照开关不改训练，F-084 / D-073）。
    # 快照 3 次 / run，估计约 0.3 GB / run、6 run 约 1.8 GB（≤ 20 GB，D-073）。
    set:
      <<: *d_base
      evaluation.snapshot_rounds: "6/15/60"   # 字符串（列表在 [设定4] 里往返会变形）；6 / 15 = P0，60 = 末态
    factors:
      placement:
        - {label: collocated,  set: {backdoor.malicious_per_edge: [10, 0, 0, 0]}}
        - {label: distributed, set: {backdoor.malicious_per_edge: [3, 3, 2, 2]}}

  SNAP5:
    purpose: "D-099：H1 / H3 的 5 seed 对照臂（SNAP 同配置 × s45 / s46）"
    requires: [audit, h-main]      # h-main：P1 / CCSP 有臂判 go_main 之后加进 available（否则 H1 / H3 不跑，这 4 个 run 白交）
    seeds: [45, 46]
    # 与 SNAP 逐字同一个 set（含快照：P0 不读 s45 / s46，但留着让对照臂与 SNAP 同配置；约 0.3 GB / run）。
    set:
      <<: *d_base
      evaluation.snapshot_rounds: "6/15/60"
    factors:
      placement:
        - {label: collocated,  set: {backdoor.malicious_per_edge: [10, 0, 0, 0]}}
        - {label: distributed, set: {backdoor.malicious_per_edge: [3, 3, 2, 2]}}

  P1:
    purpose: "PLAN §4 P1 的最小版（D-108）：上传前加固（A-pre）在线跑满 60 云轮，集中布点、s42、单 run；对照 = SNAP__collocated__s42"
    requires: [audit, sa1-pre]     # sa1-pre：SA1 的「上传前加固」接线完成（D-108）。不用 SA1（那个 token 会顺带放行 CAL）
    seeds: [42]
    # 与 SNAP-collocated 只差：加固开关 + 不存快照（快照只是记录，不改训练）。配置 = P0 里精度代价最小、又砍得动的那个（F-100）。
    set:
      <<: *d_base
      defense.edge_harden: sau-e8-train-high
    cells:
      - {cell: col-pre,  set: {backdoor.malicious_per_edge: [10, 0, 0, 0]}}
      # D-111（2026-10-29）：分散布点的筛选，对照 = SNAP__distributed__s42；判定 p1_verdict.py --placement distributed
      - {cell: dist-pre, set: {backdoor.malicious_per_edge: [3, 3, 2, 2]}}

  H1:
    purpose: "PLAN §4 H1 的 A-pre 臂（D-111）：P1__col-pre 判 go_main_col（F-103）→ 同配置补 s43 / s44，s42 复用 P1；对照 = SNAP__collocated__s4x。先 3 seed（D-111 偏离 D-099 的 5 seed，s45 / s46 等 3 seed 结果再定）"
    requires: [audit, sa1-pre]
    seeds: [43, 44]
    # 与 P1 col-pre 逐字同一个 set（守卫 test_h1_differs_from_p1_col_pre_only_in_seed）。判定 harness/h1_verdict.py（先 commit 再交）。
    set:
      <<: *d_base
      defense.edge_harden: sau-e8-train-high
    cells:
      - {cell: col-pre, set: {backdoor.malicious_per_edge: [10, 0, 0, 0]}}

  CAL:
    purpose: "不饱和工作点 W2 的选择（PLAN §4 CAL）：V 末值 ∈ [0.3, 0.8] 且 E0 良性 ≥ 0.7 的最强设置"
    requires: [audit, SA1]          # 不需要新代码；与 P1 同批交（PLAN §5）→ 挂 SA1
    seeds: [42]
    set:
      <<: *d_base
    cells:
      - {cell: rho05-collocated,  set: {backdoor.poison_ratio: 0.05, backdoor.malicious_per_edge: [10, 0, 0, 0]}}
      - {cell: rho05-distributed, set: {backdoor.poison_ratio: 0.05, backdoor.malicious_per_edge: [3, 3, 2, 2]}}
      - {cell: rho10-collocated,  set: {backdoor.poison_ratio: 0.10, backdoor.malicious_per_edge: [10, 0, 0, 0]}}
      - {cell: rho10-distributed, set: {backdoor.poison_ratio: 0.10, backdoor.malicious_per_edge: [3, 3, 2, 2]}}
      - {cell: mal5-collocated,   set: {backdoor.malicious_per_edge: [5, 0, 0, 0]}}
      - {cell: mal5-distributed,  set: {backdoor.malicious_per_edge: [2, 1, 1, 1]}}

  CCSF:
    purpose: "CCS 的 flat 复现闸（PLAN §4 CCSF）：off vs CCS-full，flat 1 edge × 100 端 × 300 轮"
    requires: [audit, SA-C, ccs-space]   # ccs-space：对抗样本空间 = input（探针 F-102，D-110，2026-10-29 放行）
    seeds: [42]
    # 划分（D-098）：主实验 = CCS 原文的 Dir 0.5 = base.yaml 的旧 `noniid`（逐类 Dirichlet、客户端不等大；F-090）→ set 里**不覆盖** partition；
    #   equal_random 那一轮在主实验之后另登记。恶意端数据占比不再恰为 10%，结果里要报告。
    # flat 下 R=1，网格 5 → 两个 eval_interval = lcm(5,1)/1 = 5（config_validate §4b' 核对）。
    # 模型（D-109 Q3）：两格都用 resnet10_torch_proj（= resnet10_torch + CCS 的私有投影网络），off 与 ccs-full 只差 defense 块。
    # CCS 参数全取缺省（defense/ccs_spec.py DEFAULTS：原文系数 0.01 / 0.01、官方代码的对抗样本、space=input、pool=round）；
    #   space：探针（analysis/ccs_space_probe.py，F-102）显示 input / pixel 同一量级 → D-110 定 input、不加格；
    #   pixel 版留作 CCSF 不是 ccs_reproduces 时的排查项。
    # D-113 / D-114（2026-10-30）：FedRep 下 ccs-full 的主任务垮了（F-109）→ CCSF 改在**官方框架**下验证实现：
    #   hier_fedper（每步联合训练 body + proj + head，BN 统计量共享）+ 官方超参数（config/defaults.yaml：
    #   local_epoch 2、batch 64、lr 0.1 常数、无 momentum）。旧的 FedRep 版两格结果留在 results/（sha 不同 → stale），作「迁移」参照。
    #   内存：ccs 格子主机内存峰值约 31 GiB（F-108）→ 提交时 PACK=2 PACK_MEM_PER_RUN_GB=48。
    set: {federation.n_edges: 1, federation.edge_rounds: 1, federation.n_rounds: 300, stopping: null,
          evaluation.eval_grid: 5, evaluation.eval_interval: 5, backdoor.eval_interval: 5,
          backdoor.malicious_per_edge: [10], model.arch: resnet10_torch_proj,
          training.drift_correction: hier_fedper, training.local_epochs: 2, data.batch_size: 64,
          training.learning_rate: 0.1, training.lr_decay: 1.0}
    cells:
      - {cell: "off"}
      - {cell: ccs-full, set: {defense.name: ccs, defense.layers: [client, edge], defense.ccs.at: true,
                               defense.ccs.cluster: true, defense.ccs.space: input, defense.ccs.pool: round}}

  CCSBOFF:
    purpose: "D-118 第一步：BatchNorm 统计量改成共享后，后门还能不能植入 FedRep 的良性客户端（条件 1：良性端攻击成功率 ≥ 0.5）。不加防御，300 轮。不过 → 开 CCS 那格不交（防御效果无从验证）"
    protocol: P2-ablation          # 刻意偏离对齐模板（模板要求统计量私有）
    requires: [audit, SA-C, ccs-space]
    seeds: [42]
    set: {federation.n_edges: 1, federation.edge_rounds: 1, federation.n_rounds: 300, stopping: null,
          evaluation.eval_grid: 5, evaluation.eval_interval: 5, backdoor.eval_interval: 5,
          backdoor.malicious_per_edge: [10], model.arch: resnet10_torch_proj,
          training.fedrep_bn_stats: shared}
    cells:
      - {cell: fedrep-bnshared-off}

  CCSB:
    purpose: "D-118 第二步：统计量共享下 FedRep + CCS，300 轮；对照 = CCSBOFF。判定 harness/ccsf_verdict.py（条件 2：降 ≥ 0.5；条件 3：主任务精度降 ≤ 0.02）"
    protocol: P2-ablation
    requires: [audit, SA-C, ccs-space, ccsb-attack-ok]   # ccsb-attack-ok：CCSBOFF 的良性端攻击成功率 ≥ 0.5、用户放行后加进 available
    seeds: [42]
    # 与 CCSB30 只差 n_rounds；与 CCSBOFF 只差防御设置
    set: {federation.n_edges: 1, federation.edge_rounds: 1, federation.n_rounds: 300, stopping: null,
          evaluation.eval_grid: 5, evaluation.eval_interval: 5, backdoor.eval_interval: 5,
          backdoor.malicious_per_edge: [10], model.arch: resnet10_torch_proj,
          training.fedrep_bn_stats: shared}
    cells:
      - {cell: fedrep-bnshared-ccs, set: {defense.name: ccs, defense.layers: [client, edge], defense.ccs.at: true,
                                          defense.ccs.cluster: true, defense.ccs.space: input, defense.ccs.pool: round}}

  CCSB30:
    purpose: "D-117：FedRep + CCS 的主任务崩坏是不是因为客户端保存的私有 BatchNorm 统计量与新主干失配（F-112：陈旧个性化 0.54、新鲜个性化 0.32；FedPer 统计量共享则不垮）。与旧 FedRep 版 CCS（legacy/CCSF-fedrep/）只差 training.fedrep_bn_stats: shared 与 n_rounds 30"
    protocol: P2-ablation          # 刻意偏离对齐模板（模板要求统计量私有）→ 如实标成消融口径；config_validate 不逐键核对模板
    requires: [audit, SA-C, ccs-space]
    seeds: [42]
    set: {federation.n_edges: 1, federation.edge_rounds: 1, federation.n_rounds: 30, stopping: null,
          evaluation.eval_grid: 5, evaluation.eval_interval: 5, backdoor.eval_interval: 5,
          backdoor.malicious_per_edge: [10], model.arch: resnet10_torch_proj,
          training.fedrep_bn_stats: shared}
    cells:
      - {cell: fedrep-bnshared-ccs, set: {defense.name: ccs, defense.layers: [client, edge], defense.ccs.at: true,
                                          defense.ccs.cluster: true, defense.ccs.space: input, defense.ccs.pool: round}}

  CCSR30:
    purpose: "D-116 第一步：FedRep + 私有投影网络两段都训练（training.fedrep_proj_phase: both，照用户的 CCS 复现仓库的 FedRep）+ CCS，30 轮。只看主任务有没有在前 30 轮垮掉（旧 FedRep 版 CCS 第 10 轮就垮了）；对照 = legacy/CCSF-fedrep 的不加防御结果的前 30 轮"
    requires: [audit, SA-C, ccs-space]
    seeds: [42]
    # 与旧 FedRep 版 CCSF__ccs-full（legacy/CCSF-fedrep/）只差：fedrep_proj_phase both + n_rounds 30
    set: {federation.n_edges: 1, federation.edge_rounds: 1, federation.n_rounds: 30, stopping: null,
          evaluation.eval_grid: 5, evaluation.eval_interval: 5, backdoor.eval_interval: 5,
          backdoor.malicious_per_edge: [10], model.arch: resnet10_torch_proj,
          training.fedrep_proj_phase: both}
    cells:
      - {cell: fedrep-projboth-ccs, set: {defense.name: ccs, defense.layers: [client, edge], defense.ccs.at: true,
                                          defense.ccs.cluster: true, defense.ccs.space: input, defense.ccs.pool: round}}

  CCSL:
    purpose: "D-115：FedPer 下 Bad-PFL 没传到良性端（F-110）是不是因为本地训练量太小 —— 官方 Bad-PFL（FedBN）的剂量反应：每轮 15 / 45 / 75 步 → ASR 0.22 / 0.80 / 0.88；CCSF 的官方超参数约 12 步 / 轮。FedPer + 我们的训练量（5 epoch、batch 32，约 55 步 / 轮）、无防御、300 轮"
    requires: [audit, SA-C, ccs-space]
    seeds: [42]
    # 与 CCSA__fedper-ours-off 逐字同配置，只差 n_rounds（守卫 test_ccsl_is_ccsa_off_with_300_rounds）
    set: {federation.n_edges: 1, federation.edge_rounds: 1, federation.n_rounds: 300, stopping: null,
          evaluation.eval_grid: 5, evaluation.eval_interval: 5, backdoor.eval_interval: 5,
          backdoor.malicious_per_edge: [10], model.arch: resnet10_torch_proj,
          training.drift_correction: hier_fedper}
    cells:
      - {cell: fedper-ours-off}

  CCSA:
    purpose: "D-113 的消融（F-110）：FedPer + **我们的**超参数（5 epoch、batch 32、lr 0.1 按有效轮衰减），30 轮。与 CCSF（FedPer + 官方超参数）的前 30 轮、旧 FedRep 版 CCSF 的前 30 轮对比 → 分清主任务崩坏来自框架还是超参数"
    requires: [audit, SA-C, ccs-space]
    seeds: [42]
    # 只比 CCSF 少两处：训练量 / batch / lr 日程用 base 的值（不覆盖），n_rounds 30（第 10 轮主任务就已分开，F-109）。
    set: {federation.n_edges: 1, federation.edge_rounds: 1, federation.n_rounds: 30, stopping: null,
          evaluation.eval_grid: 5, evaluation.eval_interval: 5, backdoor.eval_interval: 5,
          backdoor.malicious_per_edge: [10], model.arch: resnet10_torch_proj,
          training.drift_correction: hier_fedper}
    cells:
      - {cell: fedper-ours-off}
      - {cell: fedper-ours-ccs, set: {defense.name: ccs, defense.layers: [client, edge], defense.ccs.at: true,
                                      defense.ccs.cluster: true, defense.ccs.space: input, defense.ccs.pool: round}}
